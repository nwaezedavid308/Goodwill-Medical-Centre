    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <style>
        /* ========================================
           DESIGN TOKENS & CSS CUSTOM PROPERTIES
           ======================================== */
        :root {
            /* Colors - Purple & Cream Healthcare Theme */
            --color-primary: #9333ea;
            --color-primary-dark: #7c3aed;
            --color-primary-light: #a855f7;
            --color-primary-50: #faf5ff;
            --color-primary-100: #f3e8ff;

            --color-bg: #FFF9F2;
            --color-surface: #ffffff;
            --color-surface-elevated: #fefefe;

            --color-text: #1e293b;
            --color-text-muted: #64748b;
            --color-text-light: #94a3b8;

            --color-slate-50: #f8fafc;
            --color-slate-100: #f1f5f9;
            --color-slate-900: #0f172a;

            /* Spacing Scale */
            --space-xs: 0.5rem;
            --space-sm: 1rem;
            --space-md: 1.5rem;
            --space-lg: 2rem;
            --space-xl: 3rem;
            --space-2xl: 4rem;
            --space-3xl: 6rem;

            /* Typography */
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;

            --text-xs: 0.75rem;
            --text-sm: 0.875rem;
            --text-base: 1rem;
            --text-lg: 1.125rem;
            --text-xl: 1.25rem;
            --text-2xl: 1.5rem;
            --text-3xl: 1.875rem;
            --text-4xl: 2.25rem;
            --text-5xl: 3rem;

            /* Border Radius */
            --radius-sm: 0.5rem;
            --radius-md: 1rem;
            --radius-lg: 1.5rem;
            --radius-xl: 2rem;
            --radius-2xl: 2.5rem;
            --radius-3xl: 3rem;

            /* Shadows */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            --shadow-2xl: 0 25px 50px -12px rgb(0 0 0 / 0.25);

            /* Transitions */
            --transition-fast: 150ms ease-out;
            --transition-base: 200ms ease-out;
            --transition-slow: 300ms ease-out;

            /* Z-Index Scale */
            --z-base: 1;
            --z-elevated: 10;
            --z-sticky: 100;
            --z-overlay: 1000;
            --z-modal: 2000;
        }

        /* ========================================
           GLOBAL STYLES
           ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        .font-serif {
            font-family: var(--font-serif);
        }

        /* ========================================
           ACCESSIBILITY ENHANCEMENTS
           ======================================== */

        /* Focus Visible - WCAG 2.1 Compliant */
        *:focus {
            outline: none;
        }

        *:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
            border-radius: 4px;
        }

        /* Skip to Main Content Link */
        .skip-to-main {
            position: absolute;
            top: -100px;
            left: 0;
            background: var(--color-primary);
            color: white;
            padding: 0.75rem 1.5rem;
            text-decoration: none;
            border-radius: 0 0 0.5rem 0;
            font-weight: 600;
            z-index: var(--z-modal);
            transition: top var(--transition-fast);
        }

        .skip-to-main:focus {
            top: 0;
        }

        /* Reduced Motion Support */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* ========================================
           LOADING STATES
           ======================================== */
        .img-loading {
            background: linear-gradient(90deg,
                    var(--color-slate-100) 25%,
                    var(--color-slate-50) 50%,
                    var(--color-slate-100) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        /* ========================================
           SMOOTH SCROLLING
           ======================================== */
        html {
            scroll-behavior: smooth;
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }
        }

        /* ========================================
           UTILITY CLASSES
           ======================================== */

        /* Screen Reader Only */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        /* Interactive Elements - Minimum Touch Target */
        button,
        a,
        input,
        select,
        textarea {
            min-height: 44px;
            min-width: 44px;
        }

        /* Button Base Styles */
        button {
            cursor: pointer;
            font-family: inherit;
            border: none;
            background: none;
            transition: all var(--transition-base);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Link Styles */
        a {
            color: inherit;
            text-decoration: none;
            transition: color var(--transition-fast);
        }

        /* Image Optimization */
        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* ========================================
           MOTION & ANIMATIONS
           ======================================== */

        /* Fade In Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn var(--transition-slow) ease-out;
        }

        /* Scale on Hover */
        .hover-scale {
            transition: transform var(--transition-base);
        }

        .hover-scale:hover {
            transform: scale(1.02);
        }

        /* Lift on Hover */
        .hover-lift {
            transition: transform var(--transition-base), box-shadow var(--transition-base);
        }

        .hover-lift:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-xl);
        }
    </style>

</head>

<body>
    <a href="#main-content" class="skip-to-main">Skip to main content</a>
    <div id="root"></div>
